<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C0E12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="kcoder">
<title>kcoder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/github-dark.min.css" id="hljs-dark">
<link rel="stylesheet" href="vendor/github-light.min.css" id="hljs-light" disabled>
<link rel="stylesheet" href="vendor/xterm.min.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<header id="header">
  <button id="brand" class="brand" title="About kcoder"><pre id="banner" class="banner compact" aria-label="KCODER"></pre><span class="wordmark">kcoder</span></button>
  <nav class="views" role="tablist">
    <button data-view="wall" title="Sessions: the grid, or 1 to 3 panes  (alt+1)">sessions</button>
    <button data-view="tasks" title="Task queue and schedules  (alt+2)">tasks <span id="tasks-count" class="count" hidden></span></button>
    <button data-view="stats" title="Stats  (alt+3)">stats</button>
  </nav>
  <input id="omni" class="omni" type="search" placeholder="Search or run a command  ⌘K" autocomplete="off" title="Search sessions or run a command  (⌘K)">
  <div class="tools">
    <button id="btn-inbox" title="Inbox: approvals and sessions waiting on you  (a)">inbox <span id="inbox-count" class="count" hidden></span></button>
    <button id="btn-new" title="New session  (n)">+ new</button>
  </div>
</header>

<main id="main">
  <div id="sessions-bar" class="sessions-bar" hidden>
    <div class="layout-picker" role="radiogroup" aria-label="layout">
      <button data-layout="grid" title="Every live session as a grid">grid</button>
      <button data-layout="1" title="One session, full width">1</button>
      <button data-layout="2" title="Two sessions side by side">2</button>
      <button data-layout="3" title="Three sessions side by side">3</button>
    </div>
    <button id="btn-broadcast" title="Broadcast: send one prompt to every open pane">⇶ broadcast</button>
    <span class="help" id="sessions-hint"></span>
  </div>
  <section id="view-wall" class="view" hidden>
    <div id="wall" class="wall"></div>
    <div id="wall-empty" class="empty" hidden>
      <pre class="banner big" aria-label="KCODER"></pre>
      <p class="tagline" id="tagline"></p>
      <p>No running sessions.</p>
      <p><button class="primary" data-action="new">Start one</button> or press <kbd>n</kbd>.</p>
    </div>
  </section>

  <section id="view-chat" class="view chatview" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <input id="search" type="search" placeholder="search chats…  (⌘⇧F)" autocomplete="off">
        <button id="btn-new-chat" title="New chat in this project">+</button>
      </div>
      <div id="projects" class="projects"></div>
      <div class="sidebar-foot"><button id="btn-archived" class="link" title="Projects with no live session, and archived chats, are hidden until you show them" hidden></button><span class="help">drag a chat onto a pane</span></div>
    </aside>
    <div id="split" class="split" data-n="1"></div>
  </section>

  <section id="view-stats" class="view statsview" hidden>
    <div id="stats-body" class="stats-body"></div>
  </section>

  <section id="view-tasks" class="view tasksview" hidden>
    <div id="tasks-body" class="tasks-body"></div>
  </section>

</main>

<footer id="statusbar" class="statusbar">
  <span id="conn" class="conn" title="daemon connection"></span>
  <span id="status-down" class="status-item warn" hidden></span>
  <span id="status-items" class="status-items"></span>
  <span class="spacer"></span>
  <button id="btn-claude" class="status-item" title="Your Claude plan: connect, reconnect, limits">Claude</button>
  <button id="btn-version" class="status-item dim" title="Version · settings">kcoder</button>
</footer>

<div id="overlay" class="overlay" hidden></div>
<div id="toasts" class="toasts"></div>

<template id="tpl-cpane">
  <div class="cpane">
    <div class="cpane-bar">
      <span class="dot"></span>
      <button class="picker" title="Pick a session for this pane">pick a session ▾</button>
      <span class="meta"></span>
      <span class="spacer"></span>
      <button data-pane="view" class="view-toggle" title="Chat / terminal view  (v)">☰</button>
      <span class="ctx sec"></span>
      <select data-act="trust" class="sec" title="trust"><option value="auto">auto</option><option value="write">write</option><option value="read">read</option><option value="none">none</option><option value="dry">dry run</option></select>
      <select data-act="model" class="sec" title="model"></select>
      <button data-act="interrupt" class="sec" title="Interrupt (Esc)">■</button>
      <button data-pane="find" class="sec" title="Find in session (⌘F)">⌕</button>
      <button data-pane="zoom" title="Pop out / back to grid (⌘⇧↩)">⤢</button>
      <button data-pane="close" title="Close pane (⌘⇧W)">✕</button>
      <button data-pane="menu" title="More">⋯</button>
    </div>
    <div class="cpane-find" hidden><input placeholder="find in this session…" autocomplete="off"><span class="count"></span><button data-find="prev" title="previous (⇧↩)">↑</button><button data-find="next" title="next (↩)">↓</button><button data-find="close" title="close (esc)">✕</button></div>
    <div class="chat-log"></div>
    <button class="jump" hidden>↓ jump to latest</button>
    <div class="composer-slot"></div>
  </div>
</template>

<template id="tpl-composer">
  <form class="composer" autocomplete="off">
    <div class="attachments" hidden></div>
    <div class="chips" hidden></div>
    <div class="composer-row">
      <span class="prompt-label">you&gt;</span>
      <textarea rows="1" placeholder="Message kcoder…  (Enter sends · Shift+Enter newline · / commands · @ files · Esc interrupts)"></textarea>
      <button type="button" class="mic" title="Voice input: speak, the words land here; click again or pause to stop (⌘⇧M)">🎤</button>
      <button type="submit" class="send" title="Send (Enter)">➤</button>
      <button type="button" class="stop" title="Interrupt (Esc)" hidden>■</button>
    </div>
    <div class="menu" hidden></div>
  </form>
</template>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
