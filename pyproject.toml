[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcoder"
version = "0.6.9"
description = "kcoder - a terminal coding agent developed by Kyle Niedzwiecki"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Niedzwiecki" }]
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.60.0",
    "rich>=13.0.0",
    "pyfiglet>=1.0.0",
    "websockets>=13.0",
    # the phone: AES-GCM for the frames through the relay. cryptography 49 (June 2026) stopped
    # shipping wheels for Intel Macs and 32-bit Windows: there pip would compile it (Rust, OpenSSL)
    # and fail, so those stay on the last version with a ready build
    "cryptography>=42.0",
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography<49; sys_platform == 'win32' and platform_machine == 'x86'",
    "prompt_toolkit>=3.0",
    "pywebview>=5.0; sys_platform == 'darwin'",
    # on-device dictation in the app window (macOS Speech framework)
    "pyobjc-framework-Speech>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/kjniedz/kcoder"

[project.optional-dependencies]
app = ["pywebview>=5.0"]
# Windows extras, installed best-effort by install.ps1: the terminal view (ConPTY)
windows = ["pywinpty>=2.0"]

[project.scripts]
kcoder = "kcoder.cli:main"
kcoderd = "kcoder.daemon:main"

[tool.setuptools.packages.find]
include = ["kcoder*"]

[tool.setuptools.package-data]
kcoder = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "web/*.webmanifest", "web/*.ico", "web/vendor/*", "data/*.txt"]
