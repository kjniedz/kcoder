name: install + smoke test

# Windows and Linux: run the real installer from this checkout, prove `kcoder`
# is on PATH in a fresh shell, then run scripts/smoke_test.py (isolated daemon,
# fake claude CLI, no API keys). macOS is tested locally (runners cost 10x).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install.ps1
      - install.sh
      - pyproject.toml
      - scripts/smoke_test.py
      - kcoder/compat.py
      - kcoder/shell.py
      - kcoder/tools.py
      - kcoder/paths.py
      - .github/workflows/install-smoke.yml

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run install.ps1 (from this checkout, no app launch)
        shell: powershell
        env:
          KCODER_NO_LAUNCH: "1"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
      - name: kcoder is recognized in a new shell (PATH from the registry)
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          Get-Command kcoder | Format-List Source
          kcoder --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Start Menu and Desktop shortcuts exist
        shell: powershell
        run: |
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\kcoder.lnk")) { Write-Error 'no Start Menu shortcut'; exit 1 }
          if (-not (Test-Path "$HOME\Desktop\kcoder.lnk")) { Write-Error 'no Desktop shortcut'; exit 1 }
      - name: The shortcut starts kcoder with a bare kcoder folder next to it (-P, the usual checkout location)
        shell: powershell
        run: |
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$HOME\Desktop\kcoder.lnk")
          Write-Host "shortcut: $($lnk.TargetPath) $($lnk.Arguments) in $($lnk.WorkingDirectory)"
          if ($lnk.Arguments -notlike '-P -m kcoder.cli app*') { Write-Error "the shortcut does not run Python with -P: $($lnk.Arguments)"; exit 1 }
          New-Item -ItemType Directory -Force "$HOME\kcoder" | Out-Null
          Set-Location $HOME
          & "$env:LOCALAPPDATA\Programs\kcoder\venv\Scripts\python.exe" -P -m kcoder.cli --version
          if ($LASTEXITCODE -ne 0) { Write-Error 'python -P -m kcoder.cli fails from the home folder'; exit 1 }
          Remove-Item "$HOME\kcoder"
      - name: Smoke test
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\Programs\kcoder\venv\Scripts\python.exe" scripts\smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run install.sh (from this checkout, no app launch)
        env:
          KCODER_NO_LAUNCH: "1"
        run: bash install.sh
      - name: kcoder is on PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kcoder --version
      - name: python -P -m kcoder works from the home folder with a bare kcoder folder in it (the usual checkout location)
        run: |
          mkdir -p "$HOME/kcoder" && cd "$HOME"
          if ~/.local/share/kcoder-venv/bin/python -m kcoder.cli --version 2>/dev/null; then echo "note: no shadowing without -P on this runner"; fi
          ~/.local/share/kcoder-venv/bin/python -P -m kcoder.cli --version
          rmdir "$HOME/kcoder"
      - name: Smoke test
        run: ~/.local/share/kcoder-venv/bin/python scripts/smoke_test.py
